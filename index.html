<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tattoo Of The Day</title>

<style>
*{ box-sizing:border-box; }
html, body{ height:100%; }

body{
  margin:0;
  background:transparent; 
  font-family:Arial, sans-serif;
  color:#111;
  min-height:100vh;
  overflow:hidden;
}

#whiteShadeBg{
  display:none; 
}

#overlayBg{
  position:fixed;
  inset:0;
  background:transparent; 
  display:none;
  justify-content:center;
  align-items:center;
  height:100svh;
  width:100%;
  padding:0; 
  z-index:99999;
  overflow:hidden;
  transition: opacity .22s ease;
}

#popup{
  width:100%;
  max-width:100%; 
  height:100%;
  position:relative;
  max-height:100svh;
  overflow:hidden;
  margin:0;
  transform: translateY(18px) scale(.96);
  opacity:0;
  transition: opacity .25s ease, transform .25s ease;
}

#overlayBg.show #popup{
  opacity:1;
  transform: translateY(0) scale(1);
}

.box{
  width:100%;
  min-height:100%;
  background:#141420; 
  padding:12px 16px; 
  border-radius:0; 
  box-shadow:none; 
  border:none; 
  overflow:hidden;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center; 
}

h2{ text-align:center; margin:0 0 6px; font-size:19px; }

.imgWrap{
  border:1px solid #2a2a3a;
  border-radius:14px;
  overflow:hidden;
  background:#0f0f16;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width: 100%; 
  max-width: 235px; /* Hieman pienempi ja tasapainoisempi / Slightly smaller and balanced */
  aspect-ratio: 1/1; 
  margin: 0 auto; 
}

img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  opacity:0;
  transition:.3s;
}
img.show{ opacity:1; }

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
  padding:10px;
  pointer-events:none;
}

.btn{
  pointer-events:auto;
  border:none;
  border-radius:10px;
  padding:6px 12px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  width:100%;
  max-width:200px;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
  transition:.25s;
  position:relative;
  overflow:hidden;
}

#spinBtn{
  background: radial-gradient(120% 120% at 30% 20%, #ffffff 0%, #efefef 45%, #d9d9d9 100%);
  color:#111;
  border: 1px solid rgba(0,0,0,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  letter-spacing:.9px;
  text-transform:uppercase;
  padding: 8px 14px;
}
#spinBtn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }

#spinBtn:hover{
  transform: translateY(-1px) scale(1.01);
  box-shadow:0 14px 35px rgba(0,0,0,.55);
}

/* Alkuperäinen pyörivä ratas-ikoni / Original spinning wheel icon */
.spinWheel{
  width:26px;
  height:26px;
  border-radius:999px;
  position:relative;
  flex:0 0 26px;
  background:
    conic-gradient(
      from 0deg,
      #111 0 18deg, #f2f2f2 18deg 36deg, #111 36deg 54deg, #f2f2f2 54deg 72deg,
      #111 72deg 90deg, #f2f2f2 90deg 108deg, #111 108deg 126deg, #f2f2f2 126deg 144deg,
      #111 144deg 162deg, #f2f2f2 162deg 180deg, #111 180deg 198deg, #f2f2f2 198deg 216deg,
      #111 216deg 234deg, #f2f2f2 234deg 252deg, #111 252deg 270deg, #f2f2f2 270deg 288deg,
      #111 288deg 306deg, #f2f2f2 306deg 324deg, #111 324deg 342deg, #f2f2f2 342deg 360deg
    );
  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,.18),
    inset 0 2px 0 rgba(255,255,255,.75),
    inset 0 -2px 0 rgba(0,0,0,.08),
    0 8px 18px rgba(0,0,0,.22);
  animation: wheelIdle 1.4s linear infinite;
  transform-origin:50% 50%;
}

.spinWheel::before{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:999px;
  background: radial-gradient(circle at 30% 25%, #ffffff 0%, #d8d8d8 45%, #bcbcbc 100%);
  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,.10),
    0 0 0 2px rgba(255,255,255,.35);
}

.spinWheel::after{
  content:"";
  position:absolute;
  top:-4px;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:4px solid transparent;
  border-right:4px solid transparent;
  border-bottom:7px solid rgba(0,0,0,.85);
  filter: drop-shadow(0 2px 1px rgba(0,0,0,.15));
}

#spinBtn.isSpinning .spinWheel{
  animation: wheelFast .22s linear infinite;
}

@keyframes wheelIdle{ to{ transform: rotate(360deg); } }
@keyframes wheelFast{ to{ transform: rotate(360deg); } }

.subscribe{
  margin-top:6px; 
  font-size:11px;
  color:#bbb;
  text-align:center;
  line-height:1.3;
  max-width: 390px;
  margin-left: auto;
  margin-right: auto;
}

form{ margin-top:6px; width: 100%; max-width: 390px; margin-left: auto; margin-right: auto;} 

.inputLabel{
  display:block;
  font-size:11px;
  font-weight:600;
  color:#ddd;
  margin-bottom:3px;
  text-align:left;
}

input{
  width:100%;
  padding:7px 12px; 
  border-radius:8px;
  border:none;
  font-size:13px;
  outline:none;
}

.kirjaudu{
  width:100%;
  padding:7px 12px; 
  border-radius:8px;
  margin-top:5px; 
  font-weight:700;
  font-size:12px;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:#ffffff;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.28) 0%,
    rgba(255,255,255,.08) 45%,
    rgba(255,255,255,.14) 100%
  );
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.7),
    inset 0 -1px 1px rgba(0,0,0,.25),
    0 5px 14px rgba(0,0,0,.45);
  transition:all .3s ease;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}

.kirjaudu::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle, rgba(255,255,255,.35) 0%, transparent 65%);
  opacity:0;
  transform:scale(.6);
  transition:opacity .35s ease, transform .35s ease;
  pointer-events:none;
}

.kirjaudu:hover{
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.36) 0%,
    rgba(255,255,255,.12) 45%,
    rgba(255,255,255,.20) 100%
  );
  border-color:rgba(255,255,255,.38);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.9),
    inset 0 -1px 1px rgba(0,0,0,.3),
    0 8px 18px rgba(255,255,255,.15),
    0 5px 14px rgba(0,0,0,.5);
  transform:translateY(-1px);
}

.kirjaudu:hover::before{
  opacity:1;
  transform:scale(1);
}

.kirjaudu:active{
  transform:translateY(1px);
  box-shadow:
    inset 0 1px 2px rgba(0,0,0,.3),
    0 2px 8px rgba(0,0,0,.4);
}

.kirjaudu:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

.status{
  margin-top:4px;
  font-size:11px;
  color:#bbb;
  min-height:12px;
  text-align:center;
}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;
}
</style>
</head>

<body>
<div id="whiteShadeBg"></div>
<canvas id="confetti"></canvas>

<div id="overlayBg">
  <div id="popup">
    <div class="box">
      <h2>🔥 Tattoo Of The Day</h2>

      <div style="display: flex; justify-content: center; width: 100%;">
          <div class="imgWrap">
            <img id="img" alt="Tattoo">
            <div class="overlay">
              <button id="spinBtn" class="btn" type="button" aria-label="Spin">
                <span class="spinWheel" aria-hidden="true"></span>
                <span>SPIN</span>
              </button>
            </div>
          </div>
      </div>

      <div class="subscribe">
        Tilaa Ink Vibes -tatuointisähköpostit saadaksesi eksklusiivisia tarjouksia, alennuksia, viimeisimmät uutiset ja inspiroivaa sisältöä sekä tietoa walk-in-päivistä.
      </div>

      <iframe id="hidden_iframe" name="hidden_iframe" style="display:none;"></iframe>

      <form id="emailForm" method="POST" target="hidden_iframe"
            action="https://script.google.com/macros/s/AKfycbwYEegtNF44clO31rVT0XQJxSmsqr_FwhY6QvdbvF9n2bJUYUrcKp_Izm3y_OUhHFJcUw/exec">
        <label for="email" class="inputLabel">Sähköposti</label>
        <input 
          id="email" 
          name="email" 
          type="email" 
          inputmode="email" 
          autocomplete="email" 
          autocapitalize="none" 
          spellcheck="false" 
          required>
        <button id="submitBtn" class="kirjaudu" type="submit">Tilaa</button>
        <div id="status" class="status"></div>
      </form>
    </div>
  </div>
</div>

<script>
const overlayBg = document.getElementById("overlayBg");

function openPopup(){
  overlayBg.style.display = "flex";
  requestAnimationFrame(() => overlayBg.classList.add("show"));
  try { window.top.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) {}
  try { window.parent.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) {}
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", openPopup);
} else {
  openPopup();
}

const LOGO = "logo1.jpg";
const TOTAL = 31;
const tattoos = [...Array(TOTAL)].map((_, i) => `tattoo${i + 1}.jpg`);

const img = document.getElementById("img");
const spinBtn = document.getElementById("spinBtn");

const KEY = "tattoo24";
const DAY = 24 * 60 * 60 * 1000;

img.src = LOGO;
img.onload = () => img.classList.add("show");

function setImg(src){
  img.classList.remove("show");
  setTimeout(() => { img.src = src; }, 80);
}

function loadLock(){
  try{
    const data = JSON.parse(localStorage.getItem(KEY));
    if (!data) return null;
    if (Date.now() > data.until) return null;
    if (typeof data.i !== "number" || data.i < 0 || data.i >= tattoos.length) return null;
    return data;
  }catch{
    return null;
  }
}

function saveLock(index){
  localStorage.setItem(KEY, JSON.stringify({ i: index, until: Date.now() + DAY }));
}

function spinAnim(finalIndex){
  spinBtn.disabled = true;
  spinBtn.classList.add("isSpinning");

  let current = Math.floor(Math.random() * tattoos.length);
  let delay = 30;

  (function step(turn){
    if (turn > 14){
      setImg(tattoos[finalIndex]);
      spinBtn.classList.remove("isSpinning");
      spinBtn.disabled = false;
      return;
    }

    current = (current + 1 + Math.floor(Math.random() * 3)) % tattoos.length;
    img.src = tattoos[current];
    img.classList.add("show");
    delay = Math.round(delay * 1.12);
    setTimeout(() => step(turn + 1), delay);
  })(0);
}

const locked = loadLock();
if (locked){
  setImg(tattoos[locked.i]);
}

spinBtn.onclick = () => {
  const existing = loadLock();
  if (existing){
    setImg(tattoos[existing.i]);
    return;
  }

  const pick = Math.floor(Math.random() * tattoos.length);
  saveLock(pick);
  spinAnim(pick);
};

const emailForm = document.getElementById("emailForm");
const emailInput = document.getElementById("email");
const submitBtn = document.getElementById("submitBtn");
const statusEl = document.getElementById("status");
const hiddenIframe = document.getElementById("hidden_iframe");

let emailFormSubmitting = false;

function isValidEmail(val){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim());
}

emailForm.addEventListener("submit", (e) => {
  const val = emailInput.value.trim();

  if (!isValidEmail(val)) {
    e.preventDefault();
    statusEl.textContent = "Syötä kelvollinen sähköpostiosoite.";
    return;
  }

  submitBtn.disabled = true;
  statusEl.textContent = "Liitytään...";
  emailFormSubmitting = true;
});

hiddenIframe.addEventListener("load", () => {
  if (!emailFormSubmitting) return;
  emailFormSubmitting = false;
  submitBtn.disabled = false;
  statusEl.textContent = "Liittynyt ✅.";
  emailInput.value = "";
});
</script>
</body>
</html>
